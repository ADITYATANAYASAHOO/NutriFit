<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <meta
        name="description"
        content="Welcome to NutriFit."
    >

    <title>NutriFit — Welcome</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="auth-page">


<header>

    <div class="logo">
        NutriFit
    </div>

</header>


<main class="onboarding-container">


    <section
        class="onboarding-card active"
    >

        <div class="onboarding-icon">
            🥗
        </div>


        <h1>
            Welcome to NutriFit
        </h1>


        <p>
            Your personalized nutrition and
            fitness journey starts here.
        </p>


        <div class="onboarding-actions welcome-actions">

            <a
                href="/register-page"
                class="primary-btn"
            >
                Sign Up
            </a>
        
            <a
                href="/account"
                class="secondary-btn"
            >
                Log In
            </a>
        
        </div>

    </section>

</main>

</body>

</html>
