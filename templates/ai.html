<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <meta
        name="description"
        content="NutriBot — your NutriFit AI nutrition assistant."
    >

    <title>NutriFit — NutriBot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        /* =========================================
           NUTRIBOT PAGE
        ========================================= */

        .nutribot-page {

            min-height: 100vh;

            background: #0f172a;

            color: #e2e8f0;

            display: flex;

            flex-direction: column;

        }


        /* =========================================
           TOP BAR
        ========================================= */

        .nutribot-topbar {

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 28px;

            background: rgba(15, 23, 42, 0.97);

            border-bottom: 1px solid #263449;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .nutribot-brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .nutribot-brand-icon {

            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 20px;

            box-shadow:
                0 5px 18px
                rgba(99, 102, 241, 0.25);

        }


        .nutribot-brand-text {

            display: flex;

            flex-direction: column;

        }


        .nutribot-brand-name {

            font-size: 16px;

            font-weight: 700;

            color: #f8fafc;

        }


        .nutribot-brand-subtitle {

            font-size: 11px;

            color: #64748b;

        }


        .nutribot-actions {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .nutribot-action-btn {

            padding: 9px 14px;

            border-radius: 9px;

            border: 1px solid #334155;

            background: #1e293b;

            color: #cbd5e1;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition: 0.2s ease;

        }


        .nutribot-action-btn:hover {

            background: #273449;

            border-color: #475569;

            color: white;

            transform: translateY(-1px);

        }


        /* =========================================
           HISTORY DROPDOWN
        ========================================= */

        .history-wrapper {

            position: relative;

        }


        .history-panel {

            position: absolute;

            top: calc(100% + 10px);

            right: 0;

            width: 310px;

            max-height: 400px;

            overflow-y: auto;

            padding: 10px;

            background: #172235;

            border: 1px solid #334155;

            border-radius: 14px;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.45);

            display: none;

        }


        .history-panel.open {

            display: block;

        }


        .history-title {

            padding: 8px 10px 12px;

            color: #64748b;

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.06em;

        }


        .history-item {

            width: 100%;

            padding: 11px 12px;

            margin-bottom: 4px;

            text-align: left;

            background: transparent;

            border: none;

            border-radius: 9px;

            color: #cbd5e1;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .history-item:hover {

            background: #263449;

            color: white;

        }


        .history-item-title {

            display: block;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            font-size: 13px;

            font-weight: 600;

        }


        .history-item-date {

            display: block;

            margin-top: 4px;

            font-size: 11px;

            color: #64748b;

        }


        .history-empty {

            padding: 20px 10px;

            text-align: center;

            color: #64748b;

            font-size: 13px;

        }


        /* =========================================
           CHAT AREA
        ========================================= */

        .nutribot-main {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            flex: 1;

            display: flex;

            flex-direction: column;

        }


        .chat-page-messages {

            flex: 1;

            padding:
                45px
                25px
                170px;

            display: flex;

            flex-direction: column;

            gap: 28px;

            overflow-y: auto;

        }


        .chat-page-messages::-webkit-scrollbar {

            width: 7px;

        }


        .chat-page-messages::-webkit-scrollbar-thumb {

            background: #334155;

            border-radius: 10px;

        }


        /* =========================================
           WELCOME
        ========================================= */

        .nutribot-welcome {

            margin: auto;

            max-width: 650px;

            width: 100%;

            text-align: center;

            padding: 40px 20px;

        }


        .welcome-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 34px;

            box-shadow:
                0 12px 35px
                rgba(99, 102, 241, 0.25);

        }


        .nutribot-welcome h1 {

            margin: 0 0 10px;

            color: #f8fafc;

            font-size: 30px;

        }


        .nutribot-welcome p {

            margin: 0;

            color: #94a3b8;

            font-size: 15px;

            line-height: 1.6;

        }


        /* =========================================
           QUICK PROMPTS
        ========================================= */

        .quick-suggestions {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 25px;

        }


        .quick-suggestions button {

            padding: 9px 14px;

            border: 1px solid #334155;

            border-radius: 20px;

            background: #172235;

            color: #94a3b8;

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s ease;

        }


        .quick-suggestions button:hover {

            background: #263449;

            color: white;

            border-color: #475569;

            transform: translateY(-1px);

        }


        /* =========================================
           CHAT MESSAGES
        ========================================= */

        .chat-msg {

            display: flex;

            align-items: flex-start;

            gap: 12px;

            width: 100%;

        }


        .chat-msg.bot {

            justify-content: flex-start;

        }


        .chat-msg.user {

            justify-content: flex-end;

        }


        .chat-avatar {

            width: 34px;

            height: 34px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #263449;

            font-size: 17px;

        }


        .chat-msg.bot .chat-avatar {

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

        }


        .chat-msg > div:nth-child(2) {

            max-width: 72%;

        }


        .chat-bubble {

            color: #dbe4ef;

            font-size: 15px;

            line-height: 1.7;

            white-space: pre-line;

            word-wrap: break-word;

        }


        .chat-msg.user .chat-bubble {

            padding: 11px 15px;

            border-radius: 15px;

            background: #263449;

            border: 1px solid #334155;

            color: #f1f5f9;

        }


        .typing .chat-bubble {

            color: #64748b;

            font-style: italic;

        }


        /* =========================================
           COMPOSER
        ========================================= */

        .composer-wrapper {

            position: fixed;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%);

            width:
                min(
                    calc(100% - 40px),
                    850px
                );

            z-index: 50;

        }


        .composer {

            display: flex;

            align-items: flex-end;

            gap: 10px;

            padding:
                10px
                10px
                10px
                17px;

            background: #1e293b;

            border: 1px solid #475569;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);

        }


        .composer textarea {

            flex: 1;

            min-height: 25px;

            max-height: 130px;

            resize: none;

            border: none;

            outline: none;

            background: transparent;

            color: #f8fafc;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.5;

            padding: 7px 0;

        }


        .composer textarea::placeholder {

            color: #64748b;

        }


        .send-button {

            width: 38px;

            height: 38px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            border-radius: 11px;

            background: #6366f1;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .send-button:hover {

            background: #7c3aed;

            transform: translateY(-1px);

        }


        .send-button:disabled {

            opacity: 0.45;

            cursor: not-allowed;

            transform: none;

        }


        .composer-note {

            margin-top: 7px;

            text-align: center;

            color: #475569;

            font-size: 10px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .nutribot-topbar {

                height: 62px;

                padding: 0 14px;

            }


            .nutribot-brand-subtitle {

                display: none;

            }


            .nutribot-action-btn {

                padding: 8px 10px;

                font-size: 12px;

            }


            .chat-page-messages {

                padding:
                    30px
                    15px
                    150px;

            }


            .chat-msg > div:nth-child(2) {

                max-width: 82%;

            }


            .nutribot-welcome h1 {

                font-size: 25px;

            }


            .composer-wrapper {

                width:
                    calc(100% - 24px);

                bottom: 10px;

            }


            .history-panel {

                width:
                    min(
                        290px,
                        calc(100vw - 30px)
                    );

            }

        }

    </style>

</head>


<body>


<div class="nutribot-page">


    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="nutribot-topbar">

        <div class="nutribot-brand">

            <div class="nutribot-brand-icon">
                🤖
            </div>

            <div class="nutribot-brand-text">

                <span class="nutribot-brand-name">
                    NutriBot
                </span>

                <span class="nutribot-brand-subtitle">
                    NutriFit AI Assistant
                </span>

            </div>

        </div>


        <div class="nutribot-actions">


            <!-- HISTORY -->

            <div class="history-wrapper">

                <button
                    type="button"
                    class="nutribot-action-btn"
                    onclick="toggleHistory()"
                >
                    🕘 History
                </button>


                <div
                    class="history-panel"
                    id="historyPanel"
                >

                    <div class="history-title">
                        Chat History
                    </div>

                    <div id="historyList">

                        <div class="history-empty">
                            No conversations yet.
                        </div>

                    </div>

                </div>

            </div>


            <!-- NEW CHAT -->

            <button
                type="button"
                class="nutribot-action-btn"
                onclick="startNewChat()"
            >
                ＋ New chat
            </button>

        </div>

    </header>


    <!-- =========================================
         CHAT
    ========================================== -->

    <main class="nutribot-main">

        <div
            class="chat-page-messages"
            id="nutriMessages"
        >

            <div
                class="nutribot-welcome"
                id="welcomeScreen"
            >

                <div class="welcome-icon">
                    🤖
                </div>


                <h1>
                    How can I help you today?
                </h1>


                <p>
                    Ask me about your calories,
                    protein, meals, macros,
                    or fitness goals.
                </p>


                <div class="quick-suggestions">

                    <button
                        type="button"
                        onclick="quickMsg('What is my protein status?')"
                    >
                        💪 Protein status
                    </button>


                    <button
                        type="button"
                        onclick="quickMsg('How many calories do I have left today?')"
                    >
                        🔥 Calories left
                    </button>


                    <button
                        type="button"
                        onclick="quickMsg('What should I eat today?')"
                    >
                        🥗 What should I eat?
                    </button>


                    <button
                        type="button"
                        onclick="quickMsg('Show me my nutrition progress today.')"
                    >
                        📊 Today's progress
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================
         MESSAGE INPUT
    ========================================== -->

    <div class="composer-wrapper">

        <div class="composer">

            <textarea
                id="nutriInput"
                rows="1"
                placeholder="Message NutriBot..."
                autocomplete="off"
            ></textarea>


            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>


        <div class="composer-note">

            NutriBot can make mistakes.
            Check important nutrition information.

        </div>

    </div>


</div>


<!-- =========================================
     YOUR EXISTING JAVASCRIPT FILE
========================================== -->

<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
